name: Encoder Conformance

on:
  push:
    paths:
      - "crates/upspa-core/**"
      - "packages/extension/src/shared/passwordPolicy*"
      - "test-vectors/compatibility-profile-v1/**"
      - "scripts/gen_password_vectors.mjs"
      - "scripts/verify_corpus_corruption.sh"
      - "scripts/run_encoder_conformance.sh"
      - "tools/security-gates/**"
      - ".github/workflows/encoder-conformance.yml"
  pull_request:
    paths:
      - "crates/upspa-core/**"
      - "packages/extension/src/shared/passwordPolicy*"
      - "test-vectors/compatibility-profile-v1/**"
      - "scripts/gen_password_vectors.mjs"
      - "scripts/verify_corpus_corruption.sh"
      - "scripts/run_encoder_conformance.sh"
      - "tools/security-gates/**"
      - ".github/workflows/encoder-conformance.yml"
  workflow_dispatch:

jobs:
  encoder-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: "npm"

      - name: Setup Pinned Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          components: rustfmt, clippy

      - name: Setup Pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Merged Rust Corpus Consumer
        run: cargo test --locked -p upspa-core --test vectors_password_encoder

      - name: Run Rust Encoder Property & Boundary Tests
        run: cargo test --locked -p upspa-core --test encoder_properties

      - name: Run Merged TypeScript Corpus Consumer
        run: npm -w upspa-extension test -- src/shared/passwordPolicy.test.ts

      - name: Verify Deterministic Vector Regeneration
        run: |
          ./node_modules/.bin/tsx scripts/gen_password_vectors.mjs
          git diff --exit-code -- test-vectors/compatibility-profile-v1/

      - name: Verify Corrupted Vector Detection
        run: ./scripts/verify_corpus_corruption.sh

      - name: Run Security Gates and Fixture Checks
        run: |
          python3 tools/security-gates/run_gates.py .
          python3 tools/security-gates/test_negative_fixtures.py
          python3 tools/security-gates/test_positive_fixtures.py
